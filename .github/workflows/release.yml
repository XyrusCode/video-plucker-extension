name: Release Extension

# Releases are driven by the version number: bumping `version` in
# extension/manifest.json and landing it on main auto-triggers a build and
# publishes v<version>. The check job makes this idempotent — it only releases
# when no release for that version exists yet. `workflow_dispatch` allows manual
# runs to retry a failed release.

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and whether it needs releasing
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$version — building extension."
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r dist/plucker-extension-v${{ needs.check.outputs.version }}.zip . \
            -x ".git/*" -x ".github/*" -x ".gitignore" -x "*.DS_Store" -x "dist/*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: "Video Plucker Extension v${{ needs.check.outputs.version }}"
          body: |
            ## Video Plucker Extension v${{ needs.check.outputs.version }}

            Send videos from YouTube, X (Twitter), TikTok, and more to the Video Plucker desktop app.

            ### 📦 Extension
            - `plucker-extension-*.zip` — Load unpacked in Chrome via chrome://extensions (Developer mode enabled)
            - Or publish to the Chrome Web Store from this zip

            ### 🔗 Requirements
            - [Video Plucker Desktop](https://github.com/XyrusCode/video-plucker/releases/latest) must be running

            ### 🆕 What's new in this version
            See the commit history for details.
          files: dist/*.zip
          draft: false
          prerelease: false

  mirror:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${{ needs.check.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          for f in dist/*; do
            wrangler r2 object put "video-plucker-releases/releases/v${{ needs.check.outputs.version }}/$(basename "$f")" --file "$f"
          done
