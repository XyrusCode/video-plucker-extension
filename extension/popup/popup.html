<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Xyrus' Plucker</h1>
    </header>

    <p class="description">Send this video to the Xyrus YT Plucker desktop app for download.</p>

    <div id="url-section">

    </div>

    <button id="send-btn">
      <span class="btn-icon">📤</span> Open in Desktop App
    </button>

    <p id="status-text"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
