<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xyrus' Plucker - Options</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --accent: #e94560;
      --text-primary: #eaeaea;
      --text-secondary: #a0a0b0;
      --error: #ef4444;
      --border: #2a2a4a;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
    }
    #save-btn {
      padding: 12px 32px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    #save-btn:hover { background: #ff6b81; }
    #status {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      display: none;
    }
    #status.success {
      display: block;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid #4ade80;
      color: #4ade80;
    }
    #status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <h1>Xyrus' Plucker <span id="version" style="font-size:14px;color:var(--text-secondary);font-weight:400"></span></h1>
  <p class="subtitle">Downloads are handled by the <a href="https://github.com/XyrusCode/xyrus-yt-plucker/releases" style="color:var(--accent)" target="_blank">Xyrus YT Plucker desktop app</a>. Install it to get started.</p>

  <div class="section-title">Downloads</div>

  <div class="field">
    <label for="cookies-from-browser">Cookies from browser</label>
    <select id="cookies-from-browser">
      <option value="none">None</option>
      <option value="chrome">Chrome</option>
      <option value="edge">Edge</option>
      <option value="firefox">Firefox</option>
      <option value="brave">Brave</option>
      <option value="opera">Opera</option>
      <option value="vivaldi">Vivaldi</option>
    </select>
    <div class="hint">The desktop app will use this browser's login cookies to get past YouTube bot checks. Set in the desktop app's Options as well.</div>
  </div>

  <div class="field">
    <label for="default-quality">Default Quality</label>
    <select id="default-quality">
      <option value="bestvideo+bestaudio/best">Best Quality</option>
      <option value="best[height<=2160]">4K (2160p)</option>
      <option value="best[height<=1080]">1080p Full HD</option>
      <option value="best[height<=720]">720p HD</option>
      <option value="best[height<=480]">480p</option>
      <option value="best[height<=360]">360p</option>
      <option value="bestaudio/best">Audio Only</option>
    </select>
  </div>

  <div class="field">
    <label class="checkbox-label">
      <input type="checkbox" id="auto-download" />
      Auto-download on right-click (skip quality selector in desktop app)
    </label>
  </div>

  <button id="save-btn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
